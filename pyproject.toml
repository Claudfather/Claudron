[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claudron"
version = "0.5.3"
description = "Markdown-based knowledge engine for Claude Code agent fleets"
authors = [{ name = "Chris Rogers" }]
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
claudron = "claudron.cli:main"

[tool.setuptools.packages.find]
exclude = ["claudron.tests*"]
