name: Tests

# Runs the test suite on every PR to main and every push to main. This is the
# gate that makes the boundary program's doc-parity drift tests — TestDocParity
# (SCHEMA.md), TestEnvironmentDocParity + test_flags_section_defers_to_the_table
# (docs/CLI_CONTRACT.md) — actually execute on a PR, so a doc-vs-code drift can
# no longer merge silently. See issue #83.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
