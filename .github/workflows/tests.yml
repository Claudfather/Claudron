name: Tests

# Runs the test suite on every PR to main and every push to main. This is the
# gate that makes the boundary program's doc-parity drift tests — TestDocParity
# (SCHEMA.md), TestEnvironmentDocParity + test_flags_section_defers_to_the_table
# (docs/CLI_CONTRACT.md) — actually execute on a PR, so a doc-vs-code drift can
# no longer merge silently. See issue #83.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      # Parts of the suite (init --personal's seed commit, the sync round-trip)
      # shell out to `git commit`; a bare runner has no user identity and
      # refuses to auto-guess one, so provide one before running the tests.
      - name: Configure git identity for the test suite
        run: |
          git config --global user.email "ci@claudron.invalid"
          git config --global user.name "Claudron CI"
      - run: pytest -q

  consumers:
    # Consumer-driven contract tests: each consumer's live contract suite, from
    # its default branch, run against this change. A change that would break a
    # consumer fails here, in this PR, before it ships; an addition passes.
    # The engine never names a consumer (CLAUDE.md): only this job does, and a
    # consumer joins by adding a matrix row. Each suite runs in compat mode:
    # the engine must keep everything the consumer's copy of `claudron
    # contract --json` promises, and the consumer's own flows must work.
    name: consumer contract (${{ matrix.consumer.repo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - repo: Claudfather/clauDNA
            requirements: requirements-dev.txt
            run: python -m pytest -q tests/test_claudron_live.py
            env: CLAUDNA_CONTRACT=compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.consumer.repo }}
          path: consumer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The consumer's toolchain first, then this checkout of the engine, so
      # nothing the consumer pins can replace the engine under test.
      - run: pip install -r consumer/${{ matrix.consumer.requirements }} && pip install -e .
      - name: Run the consumer's contract suite against this change
        working-directory: consumer
        run: env ${{ matrix.consumer.env }} ${{ matrix.consumer.run }}
